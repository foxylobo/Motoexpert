name: Build MOTOEXPERT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          mkdir source
          archive=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$archive" ]; then echo 'No se encontró el ZIP del proyecto'; exit 1; fi
          unzip "$archive" -d source

      - name: Compilar APK
        run: gradle -p source/MOTOEXPERT_Android_MVP assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MOTOEXPERT-APK
          path: source/MOTOEXPERT_Android_MVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
